[project]
name = "nyc-residential-registry"
version = "0.1.0"
description = "A registry of residential buildings in New York City neighborhoods, built from public sources."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_registry"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Python only: documentation is reviewed by people, not reformatted.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "BLE", # no blind except
    "S110", # no try-except-pass
    "RUF",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
