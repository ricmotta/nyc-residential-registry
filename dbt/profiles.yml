# Every value comes from the environment (see .env.example), never from this file.
nyc_registry:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | as_number }}"
      user: "{{ env_var('REGISTRY_DB_USER') }}"
      password: "{{ env_var('REGISTRY_DB_PASSWORD') }}"
      dbname: "{{ env_var('REGISTRY_DB_NAME') }}"
      schema: public
      threads: 4
