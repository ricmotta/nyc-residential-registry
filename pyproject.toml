[project]
name = "nyc-residential-registry"
version = "0.1.0"
description = "A registry of residential buildings in New York City neighborhoods, built from public sources."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.44.9",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "types-boto3[s3]==1.44.9",
]
dbt = [
    "dbt-core==1.12.7",
    "dbt-postgres==1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_registry"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Python only: documentation is reviewed by people, not reformatted.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "BLE", # no blind except
    "S110", # no try-except-pass
    "TID251", # banned-api: these libraries live in one module each (see below)
    "RUF",
]

# Each library below may be imported only in its own module, listed in per-file-ignores.
# The message tells whoever hits the rule (often an agent) what to do instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"boto3".msg = "use nyc_registry.storage: object storage is reached only through the S3 API there (ADR 0002)."
"botocore".msg = "use nyc_registry.storage: object storage is reached only through the S3 API there (ADR 0002)."
"psycopg".msg = "use nyc_registry.db: database connections are opened only there, from Settings."
"httpx".msg = "HTTP belongs in the collector HTTP client (#15), where ADR 0006's politeness rules live. Until it exists, only the marked line in nyc_registry.smoke may import httpx."

[tool.ruff.lint.per-file-ignores]
"src/nyc_registry/storage.py" = ["TID251"]
"src/nyc_registry/db.py" = ["TID251"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.uv]
default-groups = ["dev", "dbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
